<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RNisarg Foundation – Earth Globe</title>
  <meta name="description" content="Interactive 3D Earth globe for RNisarg Foundation" />

  <!-- Performance: preconnect CDN origins early -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <!-- Load Three.js + GLTFLoader (defer keeps HTML parse non-blocking) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Base64 inline GLB (fastest possible load – no extra network round-trip) -->
  <script defer src="assets/3d-element/earth-glb.js"></script>

  <style>
    /* ── Reset ── */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      background: transparent;  /* transparent so Wix bg shows through */
      overflow: hidden;
    }

    /* ── Outer shell: fills entire iframe viewport, 10% padding on all sides ── */
    #globe-shell {
      /* Use vw/vh so it always fills the iframe regardless of parent height chain */
      width: 100vw;
      height: 100vh;
      min-width: 100vw;
      min-height: 100vh;
      padding: 10%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Globe box: takes ALL remaining space after padding ── */
    #rn-globe-box {
      /* flex-grow fills whatever space padding left behind */
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-width: 0;   /* prevent flex blowout */
      min-height: 0;
      position: relative;
      touch-action: pan-y;
    }

    /* ── Fallback PNG shown until GLB is ready ── */
    .rn-earth-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #rn-globe-box.rn-globe-ready .rn-earth-fallback {
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
    }

    /* ── WebGL canvas ── */
    #rn-earth-canvas {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      cursor: grab;
      outline: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.5s ease;
      will-change: transform;
      /* hint GPU compositing layer */
    }

    #rn-globe-box.rn-globe-ready #rn-earth-canvas {
      opacity: 1;
    }

    #rn-earth-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>

<body>

  <!-- Globe iframe root -->
  <div id="globe-shell">

    <!-- Accessible landmark: role + aria-label describe the widget -->
    <div id="rn-globe-box" role="img"
      aria-label="Interactive 3D Earth globe representing RNisarg Foundation's global environmental mission">
      <!-- Fallback image: shown immediately while JS / GLB loads -->
      <img src="assets/earth.png" alt="Earth globe – RNisarg Foundation's global environmental and healthcare mission"
        class="rn-earth-fallback" id="rn-earth-fallback" fetchpriority="high" loading="eager" decoding="async"
        onerror="this.style.display='none'" width="100%" height="100%" />

      <!-- WebGL canvas – aria-hidden because the parent div already labels the widget -->
      <canvas id="rn-earth-canvas" aria-hidden="true" title="Interactive 3D Earth globe"></canvas>
    </div>

  </div>

  <script>
    (function () {

      /* ── Wait for deferred scripts then boot ── */
      function tryInit() {
        if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
          setTimeout(tryInit, 80);
          return;
        }
        init3DScene();
      }

      /* Kick off after DOM is parsed */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', tryInit);
      } else {
        tryInit();
      }

      function init3DScene() {
        const globeBox = document.getElementById('rn-globe-box');
        const canvas = document.getElementById('rn-earth-canvas');
        if (!globeBox || !canvas) return;

        const CONFIG = {
          scale: 1.15,
          initialRotationY: 1.46,
          tiltX: 0.22,
          cameraDistance: 2.85,
          spinSpeed: 0.0022,
          ambientLight: 0.7,
          sunLight: 0.9,
          autoSpin: true
        };

        /* ── Scene ── */
        const scene = new THREE.Scene();
        const w0 = globeBox.clientWidth || 300;
        const h0 = globeBox.clientHeight || 300;
        const camera = new THREE.PerspectiveCamera(38, w0 / h0, 0.1, 1000);
        camera.position.z = CONFIG.cameraDistance;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,          /* transparent background */
          powerPreference: 'high-performance'
        });
        renderer.setClearColor(0x000000, 0);          /* fully transparent */
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); /* cap at 1.5 – faster on hi-DPI */
        renderer.setSize(w0, h0);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        /* ── Globe group ── */
        const globeGroup = new THREE.Group();
        globeGroup.rotation.y = CONFIG.initialRotationY;
        globeGroup.rotation.x = CONFIG.tiltX;
        scene.add(globeGroup);

        /* ── Lights ── */
        scene.add(new THREE.AmbientLight(0xffffff, CONFIG.ambientLight));
        scene.add(new THREE.HemisphereLight(0xffffff, 0x0D386C, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, CONFIG.sunLight);
        sun.position.set(-3.5, 2.8, 3.5);
        scene.add(sun);

        /* ── Load GLB model ── */
        const loader = new THREE.GLTFLoader();

        function onModelLoad(gltf) {
          const model = gltf.scene;
          const box = new THREE.Box3().setFromObject(model);
          const size = box.getSize(new THREE.Vector3());
          model.position.sub(box.getCenter(new THREE.Vector3()));
          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) { const s = CONFIG.scale / maxDim; model.scale.set(s, s, s); }
          globeGroup.add(model);
          handleResize();
          requestAnimationFrame(() => {
            renderer.render(scene, camera);
            globeBox.classList.add('rn-globe-ready');
          });
        }

        const glbSrc = window.EARTH_GLB_BASE64 || 'assets/3d-element/earth (1).glb';
        loader.load(
          glbSrc,
          onModelLoad,
          undefined,
          () => {
            /* If base64 failed, try the raw file */
            if (glbSrc !== 'https://static.wixstatic.com/3d/11d049_e69aaf25b10b4da083e0db3f2bb0276f.glb') {
              loader.load('https://static.wixstatic.com/3d/11d049_e69aaf25b10b4da083e0db3f2bb0276f.glb', onModelLoad, undefined,
                err => console.error('[Globe] GLB load failed:', err));
            }
          }
        );

        /* ── Drag / Touch interaction ── */
        let isDragging = false, isHSwipe = false;
        let startX = 0, startY = 0;
        let prev = { x: 0, y: 0 };
        let vx = 0, vy = 0;

        canvas.addEventListener('mousedown', e => {
          isDragging = true;
          prev = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', e => {
          if (!isDragging) return;
          vy = (e.clientX - prev.x) * 0.005;
          vx = (e.clientY - prev.y) * 0.005;
          globeGroup.rotation.y += vy;
          globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + vx));
          prev = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => { isDragging = false; });

        canvas.addEventListener('touchstart', e => {
          if (e.touches.length !== 1) return;
          isDragging = true; isHSwipe = false;
          startX = e.touches[0].clientX; startY = e.touches[0].clientY;
          prev = { x: startX, y: startY };
        }, { passive: true });

        window.addEventListener('touchmove', e => {
          if (!isDragging || e.touches.length !== 1) return;
          const cx = e.touches[0].clientX, cy = e.touches[0].clientY;
          const dx = cx - startX, dy = cy - startY;
          if (!isHSwipe) {
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 6) isHSwipe = true;
            else if (Math.abs(dy) > 8) { isDragging = false; return; }
          }
          if (isHSwipe) {
            if (e.cancelable) e.preventDefault();
            vy = (cx - prev.x) * 0.005;
            vx = (cy - prev.y) * 0.005;
            globeGroup.rotation.y += vy;
            globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + vx));
          }
          prev = { x: cx, y: cy };
        }, { passive: false });

        window.addEventListener('touchend', () => { isDragging = false; isHSwipe = false; });

        /* ── Responsive resize (ResizeObserver > window.resize) ── */
        function handleResize() {
          if (!globeBox || !renderer || !camera) return;
          const w = globeBox.clientWidth, h = globeBox.clientHeight;
          if (!w || !h) return;
          camera.aspect = w / h;
          const sw = window.innerWidth;
          camera.position.z = sw <= 400
            ? CONFIG.cameraDistance * 1.05
            : sw <= 768
              ? CONFIG.cameraDistance * 1.02
              : CONFIG.cameraDistance;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        }

        if (window.ResizeObserver) {
          new ResizeObserver(handleResize).observe(globeBox);
        } else {
          window.addEventListener('resize', handleResize);
        }

        /* ── Render loop ── */
        (function animate() {
          requestAnimationFrame(animate);
          if (!isDragging && CONFIG.autoSpin) {
            globeGroup.rotation.y += CONFIG.spinSpeed;
            vx *= 0.94; vy *= 0.94;
            globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + vx));
            globeGroup.rotation.y += vy;
          }
          renderer.render(scene, camera);
        })();
      }

    })();
  </script>

</body>

</html>
