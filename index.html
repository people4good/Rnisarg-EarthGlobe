<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RNisarg Foundation</title>
  
  <!-- Sora Font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Three.js & GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Pre-bundled GLB data for seamless file:/// and CORS-free loading -->
  <script src="assets/3d-element/earth-glb.js"></script>
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0D386C;
      --pill-bg: #567498;
      --text-white: #ffffff;
      --text-sub: #86b8e3;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-white);
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    /* Outer Wrapper: Fits Wix container cleanly */
    .wix-embed-wrapper {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      padding: clamp(1.5rem, 5vw, 4rem) clamp(1.2rem, 6vw, 4.5rem);
      position: relative;
    }

    /* Container Grid */
    .hero-container {
      width: 100%;
      max-width: 1240px;
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(280px, 0.95fr);
      align-items: center;
      justify-content: space-between;
      gap: clamp(1.5rem, 4vw, 3.5rem);
    }

    /* Left Text Content */
    .text-content {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 2;
    }

    /* Doctor-Founded Pill Badge */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      background-color: var(--pill-bg);
      color: #ffffff;
      font-size: clamp(0.72rem, 1vw, 0.8rem);
      font-weight: 500;
      padding: 0.38rem 1.05rem;
      border-radius: 999px;
      letter-spacing: 0.02em;
      margin-bottom: clamp(1rem, 2.2vw, 1.6rem);
      white-space: nowrap;
    }

    /* Heading 1 - Sora Bold with fluid typography */
    h1.hero-title {
      font-family: 'Sora', sans-serif;
      font-size: clamp(2.4rem, 5.2vw, 4.8rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.025em;
      color: #ffffff;
      margin-bottom: clamp(1rem, 2.2vw, 1.6rem);
      word-break: break-word;
    }

    /* Heading 3 - Sora Regular */
    h3.hero-tagline {
      font-family: 'Sora', sans-serif;
      font-size: clamp(0.92rem, 1.25vw, 1.1rem);
      font-weight: 400;
      line-height: 1.5;
      color: var(--text-sub);
      max-width: 480px;
    }

    h3.hero-tagline .highlight {
      color: #ffffff;
      font-weight: 600;
    }

    /* Right 3D Earth Container: Responsive aspect-ratio square */
    .globe-container {
      width: 100%;
      max-width: min(540px, 45vw);
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin: 0 auto;
      touch-action: pan-y; /* Non-blocking mobile page scrolling */
    }

    /* Instant Fallback Image */
    .earth-fallback-img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.6s ease;
      will-change: opacity;
    }

    .globe-container.globe-ready .earth-fallback-img {
      opacity: 0;
      visibility: hidden;
    }

    /* 3D Canvas */
    #earth-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      display: block;
      cursor: grab;
      outline: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .globe-container.globe-ready #earth-canvas {
      opacity: 1;
    }

    #earth-canvas:active {
      cursor: grabbing;
    }

    /* ========================================================
       RESPONSIVE BREAKPOINTS (DESKTOP, TABLET & MOBILE)
       ======================================================== */
    /* Big Screens (1600px+) */
    @media (min-width: 1600px) {
      .hero-container {
        max-width: 1360px;
      }
      .globe-container {
        max-width: 600px;
      }
    }

    /* Tablets / Small Laptops (769px - 1024px) */
    @media (max-width: 1024px) and (min-width: 769px) {
      .hero-container {
        grid-template-columns: 1.1fr 0.9fr;
        gap: 2rem;
      }
      .globe-container {
        max-width: min(420px, 42vw);
      }
    }

    /* Mobile Devices (<= 768px): Clean, compact stacked layout */
    @media (max-width: 768px) {
      .wix-embed-wrapper {
        min-height: auto;
        padding: 2.2rem 1.25rem 2.2rem;
      }

      .hero-container {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 1.75rem;
      }

      .text-content {
        align-items: center;
        max-width: 100%;
        margin: 0 auto;
      }

      .pill-badge {
        font-size: 0.72rem;
        padding: 0.35rem 0.9rem;
        margin-bottom: 0.9rem;
      }

      h1.hero-title {
        font-size: clamp(2.3rem, 8vw, 3.2rem);
        margin-bottom: 0.9rem;
      }

      h3.hero-tagline {
        font-size: clamp(0.9rem, 3.6vw, 1.02rem);
        max-width: 92%;
        margin: 0 auto;
      }

      .globe-container {
        max-width: min(300px, 74vw);
        aspect-ratio: 1 / 1;
        margin: 0 auto;
      }
    }

    /* Small Mobile Phones (<= 400px) */
    @media (max-width: 400px) {
      .wix-embed-wrapper {
        padding: 1.75rem 1rem 1.75rem;
      }

      .hero-container {
        gap: 1.35rem;
      }

      h1.hero-title {
        font-size: clamp(2.1rem, 9.5vw, 2.5rem);
      }

      .pill-badge {
        font-size: 0.68rem;
        padding: 0.3rem 0.8rem;
        margin-bottom: 0.8rem;
      }

      h3.hero-tagline {
        font-size: 0.86rem;
        max-width: 100%;
      }

      .globe-container {
        max-width: min(250px, 78vw);
      }
    }
  </style>
</head>
<body>

  <div class="wix-embed-wrapper">
    <div class="hero-container">
      
      <!-- Text Section -->
      <div class="text-content">
        <div class="pill-badge">
          Doctor-Founded&nbsp;&nbsp;Women-Led
        </div>
        
        <h1 class="hero-title">
          RNisarg<br>Foundation
        </h1>
        
        <h3 class="hero-tagline">
          <span class="highlight">Healing Planet and People</span> Since 2016 · Celebrating a decade of climate action through a healthcare lens
        </h3>
      </div>

      <!-- 3D Earth Globe with Instant Fallback Image -->
      <div class="globe-container" id="globe-box">
        <img 
          src="assets/earth.png" 
          alt="RNisarg Planet Earth" 
          class="earth-fallback-img" 
          id="earth-fallback"
          fetchpriority="high"
          loading="eager"
        >
        <canvas id="earth-canvas"></canvas>
      </div>

    </div>
  </div>

  <script>
    (function() {
      const globeBox = document.getElementById('globe-box');
      const canvas = document.getElementById('earth-canvas');
      if (!globeBox || !canvas) return;

      // Your chosen finalized configuration
      const CONFIG = {
        scale: 1.15,
        initialRotationY: 1.46,
        tiltX: 0.22,
        cameraDistance: 2.85,
        positionOffsetY: 0,
        spinSpeed: 0.0022,
        ambientLight: 0.7,
        sunLight: 0.9,
        autoSpin: true
      };

      function init3DScene() {
        if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
          setTimeout(init3DScene, 100);
          return;
        }

        const scene = new THREE.Scene();
        const initialAspect = (globeBox.clientWidth || 300) / (globeBox.clientHeight || 300);
        const camera = new THREE.PerspectiveCamera(38, initialAspect, 0.1, 1000);
        camera.position.z = CONFIG.cameraDistance;

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          alpha: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(globeBox.clientWidth, globeBox.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;

        const globeGroup = new THREE.Group();
        globeGroup.rotation.y = CONFIG.initialRotationY;
        globeGroup.rotation.x = CONFIG.tiltX;
        globeGroup.position.y = CONFIG.positionOffsetY;
        scene.add(globeGroup);

        // Clean Natural Lighting (No unnecessary glow)
        const ambientLight = new THREE.AmbientLight(0xffffff, CONFIG.ambientLight);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x0D386C, 0.5);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, CONFIG.sunLight);
        sunLight.position.set(-3.5, 2.8, 3.5);
        scene.add(sunLight);

        let modelObj = null;
        const loader = new THREE.GLTFLoader();

        function handleModelLoad(gltf) {
          modelObj = gltf.scene;

          const box = new THREE.Box3().setFromObject(modelObj);
          const center = box.getCenter(new THREE.Vector3());
          const size = box.getSize(new THREE.Vector3());
          modelObj.position.sub(center);

          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0) {
            const s = (CONFIG.scale / maxDim);
            modelObj.scale.set(s, s, s);
          }

          globeGroup.add(modelObj);

          handleResize();

          requestAnimationFrame(() => {
            renderer.render(scene, camera);
            globeBox.classList.add('globe-ready');
          });
        }

        if (window.EARTH_GLB_BASE64) {
          loader.load(
            window.EARTH_GLB_BASE64,
            handleModelLoad,
            undefined,
            function(err) {
              loader.load('assets/3d-element/earth (1).glb', handleModelLoad);
            }
          );
        } else {
          loader.load(
            'assets/3d-element/earth (1).glb',
            handleModelLoad,
            undefined,
            function(err) {
              console.error('Error loading GLB:', err);
            }
          );
        }

        // ========================================================
        // MOBILE-FRIENDLY TOUCH GESTURES (ZERO SCROLL TRAPPING)
        // ========================================================
        let isDragging = false;
        let isHorizontalSwipe = false;
        let startX = 0;
        let startY = 0;
        let previousPosition = { x: 0, y: 0 };
        let velocityX = 0;
        let velocityY = 0;

        // Desktop Mouse Drag
        canvas.addEventListener('mousedown', function(e) {
          isDragging = true;
          previousPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mousemove', function(e) {
          if (!isDragging) return;
          const deltaX = e.clientX - previousPosition.x;
          const deltaY = e.clientY - previousPosition.y;

          velocityY = deltaX * 0.005;
          velocityX = deltaY * 0.005;

          globeGroup.rotation.y += velocityY;
          globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + velocityX));

          previousPosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', function() {
          isDragging = false;
        });

        // Mobile Touch Gestures
        canvas.addEventListener('touchstart', function(e) {
          if (e.touches.length !== 1) return;
          isDragging = true;
          isHorizontalSwipe = false;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          previousPosition = { x: startX, y: startY };
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
          if (!isDragging || e.touches.length !== 1) return;
          const currentX = e.touches[0].clientX;
          const currentY = e.touches[0].clientY;
          const diffX = currentX - startX;
          const diffY = currentY - startY;

          // Detect swipe direction: horizontal rotates globe, vertical scrolls page
          if (!isHorizontalSwipe) {
            if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 6) {
              isHorizontalSwipe = true;
            } else if (Math.abs(diffY) > 8) {
              isDragging = false;
              return;
            }
          }

          if (isHorizontalSwipe) {
            if (e.cancelable) e.preventDefault();
            const deltaX = currentX - previousPosition.x;
            const deltaY = currentY - previousPosition.y;

            velocityY = deltaX * 0.005;
            velocityX = deltaY * 0.005;

            globeGroup.rotation.y += velocityY;
            globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + velocityX));
          }

          previousPosition = { x: currentX, y: currentY };
        }, { passive: false });

        window.addEventListener('touchend', function() {
          isDragging = false;
          isHorizontalSwipe = false;
        });

        // ========================================================
        // RESPONSIVE RESIZE OBSERVER (SMOOTH ADAPTATION)
        // ========================================================
        function handleResize() {
          if (!globeBox || !renderer || !camera) return;
          const width = globeBox.clientWidth;
          const height = globeBox.clientHeight;
          if (width === 0 || height === 0) return;

          camera.aspect = width / height;

          const screenW = window.innerWidth;
          if (screenW <= 400) {
            camera.position.z = CONFIG.cameraDistance * 1.05;
          } else if (screenW <= 768) {
            camera.position.z = CONFIG.cameraDistance * 1.02;
          } else {
            camera.position.z = CONFIG.cameraDistance;
          }

          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        }

        window.addEventListener('resize', handleResize);
        if (window.ResizeObserver) {
          new ResizeObserver(handleResize).observe(globeBox);
        }

        // Animation Loop
        function animate() {
          requestAnimationFrame(animate);

          if (!isDragging && CONFIG.autoSpin) {
            globeGroup.rotation.y += CONFIG.spinSpeed;
            velocityX *= 0.94;
            velocityY *= 0.94;
            globeGroup.rotation.x = Math.max(-0.8, Math.min(0.8, globeGroup.rotation.x + velocityX));
            globeGroup.rotation.y += velocityY;
          }

          renderer.render(scene, camera);
        }

        animate();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init3DScene);
      } else {
        init3DScene();
      }
    })();
  </script>
</body>
</html>
